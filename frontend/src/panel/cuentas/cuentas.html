<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuentas — GymManager</title>
  </head>

  <body>
    <p id="estado-panel" class="estado-panel" role="status">
      Comprobando sesión...
    </p>

    <section id="vista" hidden>
      <!-- Formulario para crear cuentas con uno o varios roles. -->
      <article class="tarjeta-panel tarjeta-alta-cuenta">
        <h2>Crear cuenta</h2>

        <form id="formulario-cuenta" class="formulario-cuentas" novalidate>
          <div>
            <label for="nombre">Nombre</label>
            <input
              id="nombre"
              name="nombre"
              type="text"
              maxlength="100"
              autocomplete="given-name"
              required
            />
          </div>

          <div>
            <label for="apellido">Apellido</label>
            <input
              id="apellido"
              name="apellido"
              type="text"
              maxlength="100"
              autocomplete="family-name"
              required
            />
          </div>

          <div class="ancho-completo">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              maxlength="254"
              autocomplete="off"
              required
            />
          </div>

          <fieldset id="roles-alta" class="roles-cuenta ancho-completo">
            <legend>Roles de la cuenta</legend>

            <label class="opcion-rol">
              <input type="checkbox" name="rol" value="USUARIO" checked />
              USUARIO
            </label>

            <label class="opcion-rol">
              <input type="checkbox" name="rol" value="ENTRENADOR" />
              ENTRENADOR
            </label>

            <label class="opcion-rol">
              <input type="checkbox" name="rol" value="ADMIN" />
              ADMIN
            </label>
          </fieldset>

          <div>
            <label for="contrasena">Contraseña</label>
            <input
              id="contrasena"
              name="contrasena"
              type="password"
              minlength="8"
              autocomplete="new-password"
              aria-describedby="ayuda-clave"
              required
            />
            <small id="ayuda-clave">Usá al menos 8 caracteres.</small>
          </div>

          <div>
            <label for="confirmacion-contrasena">
              Confirmar contraseña
            </label>
            <input
              id="confirmacion-contrasena"
              name="confirmacion"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <p id="mensaje-alta" role="status" aria-live="polite"></p>

          <button class="boton-panel" type="submit">
            Crear cuenta
          </button>
        </form>
      </article>

      <!-- Cada fila permite consultar y modificar los roles. -->
      <article class="tarjeta-panel">
        <header class="encabezado-cuentas">
          <h2>Cuentas registradas</h2>

          <button id="actualizar-cuentas" class="boton-panel" type="button">
            Actualizar listado
          </button>
        </header>

        <div class="filtros-cuentas">
          <div>
            <label for="buscar-cuenta">Buscar cuenta</label>
            <input
              id="buscar-cuenta"
              type="search"
              placeholder="Nombre, apellido o correo"
            />
          </div>

          <div>
            <label for="filtrar-rol">Rol</label>
            <select id="filtrar-rol">
              <option value="">Todos los roles</option>
              <option value="USUARIO">USUARIO</option>
              <option value="ENTRENADOR">ENTRENADOR</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>

          <div>
            <label for="filtrar-estado">Estado</label>
            <select id="filtrar-estado">
              <option value="">Todos los estados</option>
              <option value="activo">Activas</option>
              <option value="inactivo">Inactivas</option>
            </select>
          </div>
        </div>

        <p class="ayuda-cuentas">
          Presioná Editar para modificar los roles de una cuenta.
        </p>

        <p id="mensaje-cuentas" role="status" aria-live="polite"></p>

        <div class="contenedor-tabla-cuentas">
          <table class="tabla-cuentas">
            <caption class="descripcion-tabla">
              Cuentas registradas y edición de sus roles
            </caption>

            <thead>
              <tr>
                <th scope="col">Nombre y apellido</th>
                <th scope="col">Correo electrónico</th>
                <th scope="col">Roles</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>

            <tbody id="listado-cuentas"></tbody>
          </table>
        </div>
      </article>
    </section>

    <script type="module" src="./cuentas.ts"></script>
  </body>
</html>
