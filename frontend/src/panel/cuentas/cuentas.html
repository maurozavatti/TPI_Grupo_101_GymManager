<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuentas — GymManager</title>
  </head>

  <body>
    <p id="estado-panel" class="estado-panel" role="status">
      Comprobando sesión...
    </p>

    <section id="vista" hidden>
      <article class="tarjeta-panel">
        <header class="encabezado-cuentas">
          <h2>Cuentas registradas</h2>

          <div class="acciones-encabezado-cuentas">
            <button
              id="abrir-alta-cuenta"
              class="boton-panel"
              type="button"
              aria-expanded="false"
              aria-controls="panel-alta-cuenta"
            >
              Nueva cuenta
            </button>

            <button id="actualizar-cuentas" class="boton-panel" type="button">
              Actualizar
            </button>
          </div>
        </header>

        <!-- El alta permanece cerrada hasta que se solicita. -->
        <section
          id="panel-alta-cuenta"
          class="panel-alta-cuenta"
          aria-labelledby="titulo-alta-cuenta"
          hidden
        >
          <h3 id="titulo-alta-cuenta">Nueva cuenta</h3>

          <form id="formulario-cuenta" class="formulario-cuentas" novalidate>
            <div>
              <label for="nombre">Nombre</label>
              <input
                id="nombre"
                name="nombre"
                type="text"
                maxlength="100"
                autocomplete="given-name"
                required
              />
            </div>

            <div>
              <label for="apellido">Apellido</label>
              <input
                id="apellido"
                name="apellido"
                type="text"
                maxlength="100"
                autocomplete="family-name"
                required
              />
            </div>

            <div class="campo-correo">
              <label for="email">Correo electrónico</label>
              <input
                id="email"
                name="email"
                type="email"
                maxlength="254"
                autocomplete="off"
                required
              />
            </div>

            <div class="campo-roles">
              <span id="etiqueta-roles-alta">Roles</span>

              <details id="selector-roles-alta" class="selector-roles">
                <summary
                  aria-labelledby="etiqueta-roles-alta resumen-roles-alta"
                >
                  <span id="resumen-roles-alta">USUARIO</span>
                </summary>

                <fieldset id="roles-alta" class="roles-cuenta">
                  <legend class="descripcion-tabla">
                    Roles de la cuenta
                  </legend>

                  <label class="opcion-rol">
                    <input type="checkbox" name="rol" value="USUARIO" checked />
                    USUARIO
                  </label>

                  <label class="opcion-rol">
                    <input type="checkbox" name="rol" value="ENTRENADOR" />
                    ENTRENADOR
                  </label>

                  <label class="opcion-rol">
                    <input type="checkbox" name="rol" value="ADMIN" />
                    ADMIN
                  </label>
                </fieldset>
              </details>
            </div>

            <div class="campo-contrasena">
              <label for="contrasena">Contraseña</label>
              <input
                id="contrasena"
                name="contrasena"
                type="password"
                minlength="8"
                autocomplete="new-password"
                aria-describedby="ayuda-clave"
                required
              />
              <small id="ayuda-clave">Mínimo 8 caracteres.</small>
            </div>

            <div class="campo-contrasena">
              <label for="confirmacion-contrasena">Confirmar contraseña</label>
              <input
                id="confirmacion-contrasena"
                name="confirmacion"
                type="password"
                autocomplete="new-password"
                required
              />
            </div>

            <p id="mensaje-alta" role="status" aria-live="polite"></p>

            <button class="boton-panel" type="submit">Crear</button>
          </form>
        </section>

        <div class="filtros-cuentas">
          <div>
            <label for="buscar-cuenta">Buscar</label>
            <input
              id="buscar-cuenta"
              type="search"
              placeholder="Nombre, apellido o correo"
            />
          </div>

          <div>
            <label for="filtrar-rol">Rol</label>
            <select id="filtrar-rol">
              <option value="">Todos los roles</option>
              <option value="USUARIO">USUARIO</option>
              <option value="ENTRENADOR">ENTRENADOR</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>

          <div>
            <label for="filtrar-estado">Estado</label>
            <select id="filtrar-estado">
              <option value="">Todos los estados</option>
              <option value="activo">Activas</option>
              <option value="inactivo">Inactivas</option>
            </select>
          </div>
        </div>

        <p id="mensaje-cuentas" role="status" aria-live="polite"></p>

        <div
          id="contenedor-tabla-cuentas"
          class="contenedor-tabla-cuentas"
          tabindex="0"
          aria-label="Listado de cuentas con desplazamiento"
        >
          <table class="tabla-cuentas">
            <caption class="descripcion-tabla">
              Cuentas registradas y edición de sus roles
            </caption>

            <thead>
              <tr>
                <th scope="col">Nombre y apellido</th>
                <th scope="col">Correo electrónico</th>
                <th scope="col">Roles</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>

            <tbody id="listado-cuentas"></tbody>
          </table>
        </div>
        <nav
          id="paginacion-cuentas"
          class="paginacion-cuentas"
          aria-label="Páginas del listado de cuentas"
          hidden
        >
          <button
            id="pagina-anterior"
            class="boton-panel boton-cancelar-cuenta"
            type="button"
          >
            Anterior
          </button>

          <div id="numeros-pagina" class="numeros-pagina"></div>

          <button
            id="pagina-siguiente"
            class="boton-panel boton-cancelar-cuenta"
            type="button"
          >
            Siguiente
          </button>

          <span
            id="informacion-pagina"
            class="descripcion-tabla"
            aria-live="polite"
          ></span>
          </nav>
      </article>
    </section>

    <script type="module" src="./cuentas.ts"></script>
  </body>
</html>
