<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta — GymManager</title>
  </head>

  <body>
    <p id="estado-panel" class="estado-panel" role="status">
      Comprobando sesión...
    </p>

    <!-- El panel incorpora este contenido dentro de su estructura. -->
    <section id="vista" hidden>
      <article class="tarjeta-panel">
        <h2>Datos de la cuenta</h2>

        <dl>
          <dt>Nombre</dt>
          <dd id="nombre-usuario"></dd>

          <dt>Correo electrónico</dt>
          <dd id="correo-usuario"></dd>

          <dt>Rol</dt>
          <dd id="rol-usuario"></dd>
        </dl>
      </article>

      <article class="tarjeta-panel tarjeta-contrasena">
        <h2>Cambiar contraseña</h2>

        <form id="formulario-contrasena" class="formulario-cuenta" novalidate>
          <div>
            <label for="contrasena-actual">Contraseña actual</label>
            <input
              id="contrasena-actual"
              name="actual"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div>
            <label for="contrasena">Nueva contraseña</label>
            <input
              id="contrasena"
              name="nueva"
              type="password"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="ayuda-contrasena"
              required
            />
            <small id="ayuda-contrasena">
                Usá al menos 8 caracteres.
            </small>
          </div>

          <div>
            <label for="confirmacion-contrasena">
              Confirmar nueva contraseña
            </label>
            <input
              id="confirmacion-contrasena"
              name="confirmacion"
              type="password"
              autocomplete="new-password"
              required
            />
          </div>

          <p id="mensaje-contrasena" role="status" aria-live="polite"></p>

          <button class="boton-panel" type="submit">
            Guardar contraseña
          </button>
        </form>
      </article>
    </section>

    <script type="module" src="./cuenta.ts"></script>
  </body>
</html>
